services:
  freeswitch:
    image: ghcr.io/krivri1989/whatsapp-voice-ai:latest
    container_name: freeswitch
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "5061:5061/udp"
      - "8021:8021/tcp"
      - "16384-16500:16384-16500/udp"
    volumes:
      - extract-cert_fs-tls:/le-certs:ro
    environment:
      - SIP_IP=69.62.85.128

volumes:
  extract-cert_fs-tls:
    external: true
