version: "3.8"

services:
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    ports:
      - "80:80"
    volumes:
      - letsencrypt:/etc/letsencrypt
    command: certonly --standalone -d srv923799.hstgr.cloud --non-interactive --agree-tos --email user@srv923799.hstgr.cloud

volumes:
  letsencrypt:
