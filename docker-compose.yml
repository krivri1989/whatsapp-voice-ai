version: "3.8"

services:
  freeswitch:
    image: signalwire/freeswitch:latest
    container_name: freeswitch
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "5061:5061/udp"
      - "8021:8021/tcp"
      - "16384-16500:16384-16500/udp"
    environment:
      - SIP_IP=69.62.85.128

  whisper-stt:
    image: fedirz/faster-whisper-server:latest
    container_name: whisper-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-medium
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__LANGUAGE=en
    mem_limit: 2g

volumes:
  whisper-models:
